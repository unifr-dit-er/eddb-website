# nginx of the container. TLS and the security headers are set upstream,
# by the nginx of svx-web-eddb and the Kemp load balancer.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects (/de -> /de/): the container does not know the
    # public host name.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Former page of eddb-hub, the previous site at the root of eddb.unifr.ch,
    # still linked from elsewhere: its anchors no longer match, the projects
    # section of the page stands in.
    location ~ ^/projets/?$ {
        return 301 /#projects;
    }

    # File names carry a content hash: cache them for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
